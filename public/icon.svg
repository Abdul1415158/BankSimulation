<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bankverse-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="bankverse-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <!-- Rounded Background Container -->
  <rect width="32" height="32" rx="7" fill="url(#bankverse-bg)" />
  <!-- Bank Roof Triangle / Pediment -->
  <polygon points="16,6 5,12 27,12" fill="url(#bankverse-glow)" />
  <!-- Architrave Beam -->
  <rect x="5" y="13" width="22" height="1.5" rx="0.5" fill="#ffffff" />
  <!-- 4 Pillars -->
  <rect x="7" y="15.5" width="2.5" height="7.5" rx="0.6" fill="#e0f2fe" />
  <rect x="12" y="15.5" width="2.5" height="7.5" rx="0.6" fill="#e0f2fe" />
  <rect x="17.5" y="15.5" width="2.5" height="7.5" rx="0.6" fill="#e0f2fe" />
  <rect x="22.5" y="15.5" width="2.5" height="7.5" rx="0.6" fill="#e0f2fe" />
  <!-- Base Foundation Plinth -->
  <rect x="4" y="24" width="24" height="2" rx="0.6" fill="url(#bankverse-glow)" />
</svg>
